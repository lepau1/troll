<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TROLL</title>
<link rel="icon" href="data:,">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000}
#troll{position:fixed;width:100vw;height:100vh;object-fit:fill;left:0;top:0;user-select:none}
#overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:rgba(0,0,0,.85);z-index:100;text-align:center;font-family:Arial,Helvetica,sans-serif;color:#fff;padding:20px}
#overlay h1{font-size:36px;margin:0}
#overlay p{font-size:18px;margin:0;max-width:520px}
#overlay button{font-size:22px;padding:14px 30px;cursor:pointer}
</style>
</head>
<body>
<img id="troll" src="troll.png" alt="">
<audio id="audioFile" preload="auto" loop>
  <source src="troll.mp4">
</audio>
<div id="overlay">
  <h1>TROLL</h1>
  <p id="status"></p>
  <button id="go">CLICK TO ENTER</button>
</div>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var mode = params.get('mode') || 'main';
  var startT = parseFloat(params.get('t')) || 0;

  var audioToPlay = document.getElementById('audioFile');
  var overlay = document.getElementById('overlay');
  var bc = new BroadcastChannel('troll-sync');
  var attacking = false;
  var soundOn = false;

  function tryUnmute(){
    if (soundOn) return;
    if (!audioToPlay.paused) return;
    audioToPlay.muted = false;
    audioToPlay.play().then(function(){ soundOn = true; }).catch(function(){});
  }

  function keepTrying(){
    setTimeout(function(){
      if (soundOn) return;
      if (audioToPlay.paused) tryUnmute();
      keepTrying();
    }, 1000);
  }

  function startMusic(){
    audioToPlay.addEventListener('canplaythrough', tryUnmute);
    audioToPlay.addEventListener('loadeddata', tryUnmute);
    tryUnmute();
    keepTrying();
  }

  function spawn(){
    var url = location.origin + location.pathname + '?mode=pop&t=' + (audioToPlay.currentTime || startT);
    try {
      var w = window.open(url, 'troll' + Date.now() + Math.random(), 'width=420,height=320,left=' + (Math.random() * (screen.availWidth - 420) | 0) + ',top=' + (Math.random() * (screen.availHeight - 320) | 0));
      if (w) { try{ w.focus(); }catch(e){} }
      return w;
    } catch(e) { return null; }
  }

  function onInteract(){
    if (!attacking) return;
    if (!soundOn) tryUnmute();
  }
  function fullscreen1s(){
    if (document.documentElement.requestFullscreen && !document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(function(){});
    }
  }
  function onActivate(){
    if (!attacking) return;
    try { window.focus(); } catch(e) {}
    if (Math.random() < 0.15) fullscreen1s();
  }
  document.addEventListener('fullscreenchange', function(){
    if (document.fullscreenElement) {
      setTimeout(function(){
        try { if (document.fullscreenElement) document.exitFullscreen(); } catch(e) {}
      }, 1000);
    }
  });
  ['click','keydown','pointerdown','touchstart'].forEach(function(ev){
    document.addEventListener(ev, onInteract, {passive:true});
  });
  ['click','dblclick','mousedown','mouseup','keydown','pointerdown','touchstart'].forEach(function(ev){
    document.addEventListener(ev, onActivate);
  });

  var movable = true;
  var seizuring = false;
  var wx = Math.round(Math.random() * 400), wy = Math.round(Math.random() * 300);
  var wvx = (Math.random() < 0.5 ? -1 : 1) * (150 + Math.random() * 200);
  var wvy = (Math.random() < 0.5 ? -1 : 1) * (150 + Math.random() * 200);
  var lastT = performance.now();
  var lastLogT = 0;
  function bounceWindow(){
    if (!attacking || !movable) return;
    if (seizuring) { requestAnimationFrame(bounceWindow); return; }
    var now = performance.now();
    var dt = (now - lastT) / 1000;
    lastT = now;
    if (dt > 0.05) dt = 0.05;
    var maxX = screen.availWidth - outerWidth;
    var maxY = screen.availHeight - outerHeight;
    if (maxX < 50) maxX = 1000;
    if (maxY < 50) maxY = 700;
    wx += wvx * dt;
    wy += wvy * dt;
    if (wx < 0) { wx = 0; wvx = Math.abs(wvx); }
    if (wy < 0) { wy = 0; wvy = Math.abs(wvy); }
    if (wx > maxX) { wx = maxX; wvx = -Math.abs(wvx); }
    if (wy > maxY) { wy = maxY; wvy = -Math.abs(wvy); }
    try { window.moveTo(Math.round(wx), Math.round(wy)); } catch(e) {}
    if (now - lastLogT > 2000) {
      lastLogT = now;
      console.log('[troll:' + mode + '] pos=(' + Math.round(wx) + ',' + Math.round(wy) + ') v=(' + Math.round(wvx) + ',' + Math.round(wvy) + ') avail=(' + screen.availWidth + ',' + screen.availHeight + ') outer=(' + outerWidth + ',' + outerHeight + ') max=(' + maxX + ',' + maxY + ')');
    }
    requestAnimationFrame(bounceWindow);
  }
  function triggerSeizure(){
    if (seizuring) return;
    seizuring = true;
    var n = 0;
    var timer = setInterval(function(){
      n++;
      if (n > 6) {
        clearInterval(timer);
        seizuring = false;
        return;
      }
      try {
        window.moveTo(wx + Math.round((Math.random() - 0.5) * 150), wy + Math.round((Math.random() - 0.5) * 150));
      } catch(e) {}
    }, 16);
  }

  var TARGET = 6;
  var wid = 't' + Date.now() + '_' + Math.floor(Math.random() * 1e6);

  function amOldest(){
    var oldest = wid;
    var now = Date.now();
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf('troll_') === 0) {
        var w = k.substring(6);
        var ts = parseInt(localStorage.getItem(k), 10);
        if (!isNaN(ts) && now - ts <= 8000 && w < oldest) oldest = w;
      }
    }
    return oldest === wid;
  }

  function heartbeat(){
    try { localStorage.setItem('troll_' + wid, Date.now()); } catch(e) {}
  }

  function reconcile(){
    if (!attacking) return;
    try {
      var now = Date.now();
      var lock = localStorage.getItem('tlock');
      if (lock && now - parseInt(lock, 10) < 1500) return;
      var alive = 0;
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf('troll_') === 0) {
          var ts = parseInt(localStorage.getItem(k), 10);
          if (!isNaN(ts)) {
            if (now - ts > 8000) {
              localStorage.removeItem(k);
            } else {
              alive++;
            }
          }
        }
      }
      var want = parseInt(localStorage.getItem('twant'), 10);
      if (isNaN(want)) want = TARGET;
      var deficit = want - alive;
      if (deficit > 0) {
        localStorage.setItem('tlock', now);
        var spawnCount = Math.min(deficit, 6);
        for (var j = 0; j < spawnCount; j++) {
          (function(n){ setTimeout(function(){ spawn(); }, n * 200); })(j);
        }
      }
    } catch(e) {}
  }

  function enterAttack(){
    if (attacking) return;
    attacking = true;
    overlay.style.display = 'none';
    console.log('[troll:' + mode + '] ATTACK start, wid=' + wid + ' movable=' + movable + ' avail=(' + screen.availWidth + ',' + screen.availHeight + ') outer=(' + outerWidth + ',' + outerHeight + ') start=(' + wx + ',' + wy + ')');
    audioToPlay.currentTime = startT;
    startMusic();
    bounceWindow();
    try { localStorage.setItem('troll_' + wid, Date.now()); } catch(e) {}
    window.onbeforeunload = function(){
      try {
        var w = parseInt(localStorage.getItem('twant'), 10);
        localStorage.setItem('twant', (isNaN(w) ? TARGET : w) + 1);
        localStorage.removeItem('troll_' + wid);
      } catch(e) {}
    };
    window.onunload = function(){
      try { localStorage.removeItem('troll_' + wid); } catch(e) {}
    };
    window.addEventListener('storage', function(e){
      if (e.key && e.key.indexOf('troll_') === 0 && e.newValue === null) {
        reconcile();
      }
    });
    setInterval(heartbeat, 500);
    setInterval(reconcile, 600);
    setInterval(function(){
      try {
        if (Math.random() < 0.3) window.focus();
        if (Math.random() < 0.08) triggerSeizure();
        if (Math.random() < 0.2) wvx = -wvx;
        if (Math.random() < 0.2) wvy = -wvy;
        if (Math.random() < 0.25) {
          var sp = 150 + Math.random() * 300;
          wvx = (wvx < 0 ? -1 : 1) * sp;
          wvy = (wvy < 0 ? -1 : 1) * sp;
        }
      } catch(e) {}
    }, 800);
    setInterval(function(){
      try {
        window.resizeTo(Math.round(280 + Math.random() * 240), Math.round(220 + Math.random() * 220));
      } catch(e) {}
    }, 2500);
    setInterval(function(){
      try {
        if (Math.random() < 0.2) {
          wx = Math.round(Math.random() * (screen.availWidth - outerWidth));
          wy = Math.round(Math.random() * (screen.availHeight - outerHeight));
          window.moveTo(wx, wy);
        }
      } catch(e) {}
    }, 3000);
  }

  bc.onmessage = function(e){
    var d = e.data || {};
    if (d.type === 'sync' && !audioToPlay.paused && audioToPlay.readyState > 1) {
      var diff = d.t - audioToPlay.currentTime;
      if (diff > 0.5) audioToPlay.currentTime = d.t;
    }
  };
  setInterval(function(){
    if (!audioToPlay.paused && attacking) bc.postMessage({type:'sync', t:audioToPlay.currentTime});
  }, 250);

  if (mode === 'probe') {
    try { localStorage.setItem('troll_probe_ok', wid + ':' + Date.now()); } catch(e) {}
    setTimeout(function(){ try{ window.close(); }catch(e){} }, 1000);
    return;
  }

  if (mode === 'pop') {
    enterAttack();
    return;
  }

  var statusEl = document.getElementById('status');

  function probePopups(){
    try {
      window.open(location.origin + location.pathname + '?mode=probe', 'probe' + Date.now(), 'width=300,height=200');
    } catch(e) {}
  }

  function launch(){
    overlay.style.display = 'none';
    enterAttack();
    try {
      localStorage.setItem('twant', TARGET);
    } catch(e) {}
    for (var i = 0; i < TARGET; i++) {
      (function(n){ setTimeout(function(){ spawn(); }, n * 300); })(i);
    }
  }

  document.getElementById('go').onclick = function(){
    try { localStorage.removeItem('troll_probe_ok'); } catch(e) {}
    probePopups();
    statusEl.textContent = 'CHECKING...';
    setTimeout(function(){
      try {
        var ok = localStorage.getItem('troll_probe_ok');
        if (ok && Date.now() - parseInt(ok.split(':')[1], 10) < 2000) {
          launch();
        } else {
          statusEl.textContent = 'POPUPS ARE BLOCKED. Allow pop-ups for this site, then click again.';
        }
      } catch(e) {
        statusEl.textContent = 'POPUPS ARE BLOCKED. Allow pop-ups for this site, then click again.';
      }
    }, 800);
  };

  overlay.style.display = 'flex';
})();
</script>
</body>
</html>
